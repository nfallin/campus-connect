name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
    build-and-test:
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                working-directory: ./campus-connect-backend
        strategy:
            matrix:
                os:
                    - macos-latest
                    - windows-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: '1.22.5'
                  cache: true

            - name: Download dependencies
              run: go mod download

            - name: Build
              run: go build ./...

            - name: Run unit tests
              run: go test ./...